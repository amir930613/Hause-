.spots[hidden]{display:none}

.bottom{position:fixed;bottom:0;left:0;right:0;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none;display:flex;justify-content:center}

.bar button{font:500 15px/1 "Golos Text",system-ui,sans-serif;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:11px 15px;min-height:44px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.bar .sep{width:1px;background:var(--line);margin:4px 2px}

  background:var(--panel);border:1px solid var(--line);touch-action:none;display:flex;align-items:center;justify-content:center}
#joy[hidden]{display:none}

#loading,#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#1B2440;background:#dfe9f3}
#loading[hidden],#err[hidden]{display:none}

  uv.needsUpdate=true;
}

  g.fillStyle=c2; g.fillRect(0,0,256,256);

  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const v=rnd()*14-7; g.fillStyle=`rgb(${c1[0]+v|0},${c1[1]+v|0},${c1[2]+v|0})`; g.fillRect(i*64+2,j*64+2,60,60);}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/size,1/size); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t;
}

}

  for(const [z,s] of pil){

      B(x-0.03,x+0.03,0.05,H,a,a+0.06,frame,false); B(x-0.03,x+0.03,0.05,H,b-0.06,b,frame,false);
      for(const y of [0.75,1.55]) B(x-0.03,x+0.03,y,y+0.06,a,b,frame,false);

      for(const y of [1.85,2.1]) B(x-0.035,x+0.035,y,y+0.04,a+0.06,b-0.06,wood,false);
      const h=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.18,0.03),M2(0xC9A86A,.3,{metalness:.8}));

  const post=M2(0x3A3D43,.6,{metalness:.3});
  const sheet=(x0,z0,x1,z1)=>{
    const len=Math.hypot(x1-x0,z1-z0), along=Math.abs(x1-x0)>0.01;
    const n=Math.ceil(len/2.5);
    for(let i=0;i<=n;i++){const t=i/n, x=x0+(x1-x0)*t, z=z0+(z1-z0)*t; B(x-0.04,x+0.04,0,2.1,z-0.04,z+0.04,post,false);}

  sheet(px0+0.2,pz0,px1,pz0); sheet(px1,pz0,px1,pz1); sheet(px0+0.2,pz1,px1,pz1);

  const cx=mm(c.x), cz=mm(c.z), L=mm(c.len), W=mm(c.w);

      g.fillStyle=`rgb(${150+v*40|0},${70+v*22|0},${52+v*16|0})`; g.fillRect(x+5,y+5,250,65);} }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(1/1.04,1/0.6); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t;
}
window.brickTexture=brickTexture;
const M=(c,r=.85,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},o));
const brick=new THREE.MeshStandardMaterial({map:brickTexture(),roughness:.95});
const plaster=M(0xF4F1EA,.95), stone=M(0x9A958C,1), stoneLight=M(0xB9B4AA,1);
window.glassMat=M(0xA9CBE8,.05,{metalness:.2,transparent:true,opacity:.32,side:THREE.DoubleSide,depthWrite:false});
const frameMat=M(0xF7F7F5,.5);

const house=new THREE.Group(); scene.add(house);
const roofGroup=new THREE.Group(); scene.add(roofGroup);
const OBST=[];
const addObst=(x0,x1,z0,z1)=>OBST.push({x0:Math.min(x0,x1),x1:Math.max(x0,x1),z0:Math.min(z0,z1),z1:Math.max(z0,z1)});
const box=(x0,x1,y0,y1,z0,z1,mat,parent=house,cast=true)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0),mat);
  b.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); b.castShadow=cast; b.receiveShadow=true; parent.add(b); return b;};
const inHouse=(x,z)=>((x>-0.22&&x<13.42&&z>-0.22&&z<19.62&&!(x>4.72&&z>16.22))||(x>=13.42&&x<15.52&&z>6.78&&z<11.62));

/* ground */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),M(0x8FA36F,1));
ground.rotation.x=-Math.PI/2; ground.position.set(3,0,11); ground.receiveShadow=true; scene.add(ground);

/* floors */
const floorMat={living:M(0xD7BE97,.85),aux:M(0xD7BE97,.85),wet:M(0xD8E0E7,.8)};
for(const r of G.rooms) for(const [x0,x1,z0,z1] of r.rects){
  const m=new THREE.Mesh(new THREE.BoxGeometry(mm(x1-x0),FLOOR,mm(z1-z0)),[stone,stone,floorMat[r.kind],stone,stone,stone]);
  m.position.set(mm(x0+x1)/2,FLOOR/2,mm(z0+z1)/2); m.receiveShadow=true; house.add(m);
}
{ const [x0,x1,z0,z1]=G.terrace, t=G.ext/2;
  const m=new THREE.Mesh(new THREE.BoxGeometry(mm(x1-x0+t),FLOOR-0.05,mm(z1-z0+t)),[stone,stone,stoneLight,stone,stone,stone]);
  m.position.set(mm(x0+x1+t)/2,(FLOOR-0.05)/2,mm(z0+z1+t)/2); m.receiveShadow=true; house.add(m); }

/* walls */
for(const w of G.walls){
  const [X1,Z1,X2,Z2]=w.p.map(mm), t=mm(w.t);
  const dx=X2-X1, dz=Z2-Z1, L0=Math.hypot(dx,dz), ux=dx/L0, uz=dz/L0, off=t/2, L=L0+t;
  const shape=new THREE.Shape(); shape.moveTo(0,0);
  const g=new THREE.Group();
  const notches=w.ops.filter(o=>o.type!=='window').sort((p,q)=>p.a-q.a);
  let cur=0; const solids=[];
  for(const o of notches){
    const a=mm(o.a)+off, b=mm(o.b)+off;
    solids.push([cur,a]); cur=b;
    shape.lineTo(a,0);
    if(o.type==='arch'){ const r=(b-a)/2, sp=mm(o.spring); shape.lineTo(a,sp); shape.absarc(a+r,sp,r,Math.PI,0,true); shape.lineTo(b,0); }
    else { const top=mm(o.top); shape.lineTo(a,top); shape.lineTo(b,top); shape.lineTo(b,0);
      // casing around doorway
      const cm=M(0xEDE7DC,.6);
      for(const s of [-1,1]){
        for(const [u0,u1,y0,y1] of [[a-0.07,a,0,top+0.07],[b,b+0.07,0,top+0.07],[a-0.07,b+0.07,top,top+0.07]]){
          const m=new THREE.Mesh(new THREE.BoxGeometry(u1-u0,y1-y0,0.02),cm); m.position.set((u0+u1)/2,(y0+y1)/2,s*(t/2+0.01)); g.add(m);
        }
      }
    }
  }
  solids.push([cur,L]);
  shape.lineTo(L,0); shape.lineTo(L,H); shape.lineTo(0,H);
  for(const o of w.ops.filter(o=>o.type==='window')){
    const a=mm(o.a)+off, b=mm(o.b)+off, s=mm(o.sill), tp=mm(o.top);
    const p=new THREE.Path(); p.moveTo(a,s); p.lineTo(b,s); p.lineTo(b,tp); p.lineTo(a,tp); p.lineTo(a,s);
    shape.holes.push(p);
    const ww=b-a, hh=tp-s, f=0.06;
    const gl=new THREE.Mesh(new THREE.PlaneGeometry(ww,hh),glassMat); gl.position.set((a+b)/2,(s+tp)/2,0); gl.renderOrder=2; g.add(gl);
    const fr=(x0,x1,y0,y1)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,y1-y0,0.09),frameMat);m.position.set((x0+x1)/2,(y0+y1)/2,0);m.castShadow=true;g.add(m);};
    fr(a,b,s,s+f); fr(a,b,tp-f,tp); fr(a,a+f,s,tp); fr(b-f,b,s,tp);
    if(ww>1.0) fr((a+b)/2-0.03,(a+b)/2+0.03,s,tp);
    if(hh>1.0) fr(a,b,tp-0.45,tp-0.4);
    const sb=new THREE.Mesh(new THREE.BoxGeometry(ww+0.1,0.04,t+0.1),M(0xEDEAE3,.6)); sb.position.set((a+b)/2,s-0.02,0); g.add(sb);
  }
  const geo=new THREE.ExtrudeGeometry(shape,{depth:t,bevelEnabled:false,curveSegments:32});
  geo.translate(0,0,-t/2);
  const m=new THREE.Mesh(geo,[plaster,plaster]); m.castShadow=true; m.receiveShadow=true; g.add(m);
  if(w.ext){
    const mx=X1+ux*L0/2, mz=Z1+uz*L0/2, nx=-uz, nz=ux;
    const s=inHouse(mx+nx*0.5,mz+nz*0.5)?-1:1;
    const sg=new THREE.ExtrudeGeometry(shape,{depth:0.012,bevelEnabled:false,curveSegments:32});
    sg.translate(0,0,s>0?t/2+0.001:-t/2-0.013);
    const sk=new THREE.Mesh(sg,brick); sk.castShadow=true; sk.receiveShadow=true; g.add(sk);
    const pl=new THREE.Mesh(new THREE.BoxGeometry(L,FLOOR,t+0.04),stone); pl.position.set(L/2,-FLOOR/2,0); pl.receiveShadow=true; g.add(pl);
  }
  g.position.set(X1-ux*off,FLOOR,Z1-uz*off); g.rotation.y=Math.atan2(-dz,dx);
  house.add(g);
  const sx=X1-ux*off, sz=Z1-uz*off;
  for(const [u0,u1] of solids){ if(u1-u0<0.01) continue;
    if(Math.abs(ux)>0.5) addObst(sx+ux*u0,sx+ux*u1,Z1-t/2,Z1+t/2); else addObst(X1-t/2,X1+t/2,sz+uz*u0,sz+uz*u1); }
}

/* stairs */
{ const st=G.stair, sm=M(0xB99A6E,.8);
  for(let i=0;i<st.n;i++){ const h=FLOOR+mm(st.rise)*(i+1), z0=mm(st.z0+i*st.tread);
    box(mm(st.x0),mm(st.x1),0,h,z0,z0+mm(st.tread),sm); }
  addObst(mm(st.x0),mm(st.x1),mm(st.z0),mm(st.z0+st.n*st.tread)); }

/* porch */
const P=G.porch;
box(mm(P.x0),mm(P.x1),0,FLOOR-0.02,mm(P.z0),mm(P.z1),stoneLight);
for(let i=0;i<P.steps;i++){ const x1=mm(P.x0-P.run*i), x0=x1-mm(P.run), h=(FLOOR-0.02)*(P.steps-i)/(P.steps+1), gr=mm(P.grow*(i+1));
  box(x0,x1,0,h,mm(P.z0)-gr,mm(P.z1)+gr,stoneLight); }

/* terrace: pillars, beams, soffit, railing, steps */
{ const top=FLOOR+H, [tx0,tx1,tz0,tz1]=G.terrace.map(mm);
  for(const [cx,cz] of G.columns){ box(mm(cx)-0.19,mm(cx)+0.19,FLOOR-0.05,top,mm(cz)-0.19,mm(cz)+0.19,brick); addObst(mm(cx)-0.19,mm(cx)+0.19,mm(cz)-0.19,mm(cz)+0.19); }
  box(tx0-0.22,tx1+0.19,FLOOR+mm(G.lv.ceil)-0.05,top,tz1-0.19,tz1+0.19,brick);
  box(tx1-0.19,tx1+0.22,FLOOR+mm(G.lv.ceil)-0.05,top,tz0,tz1,brick);
  box(tx0,tx1+0.22,FLOOR+mm(G.lv.ceil),top,tz0,tz1+0.19,plaster,roofGroup,false);
  const rail=M(0xF5F5F3,.5), c0=mm(G.columns[0][0]);
  box(tx0+0.3,c0-0.25,FLOOR+0.9,FLOOR+0.95,tz1-0.03,tz1+0.03,rail);
  for(let x=tx0+0.3;x<c0-0.25;x+=0.15) box(x,x+0.025,FLOOR-0.05,FLOOR+0.9,tz1-0.012,tz1+0.012,rail,house,false);
  box(tx1-0.03,tx1+0.03,FLOOR+0.9,FLOOR+0.95,tz0+0.3,tz1-0.25,rail);
  for(let z=tz0+0.3;z<tz1-0.25;z+=0.15) box(tx1-0.012,tx1+0.012,FLOOR-0.05,FLOOR+0.9,z,z+0.025,rail,house,false);
  addObst(tx0,c0-0.2,tz1-0.06,tz1+0.06); addObst(tx1-0.06,tx1+0.06,tz0,tz1);
  addObst(c0+0.19,9.2,tz1-0.06,tz1+0.06); addObst(12.9,tx1,tz1-0.06,tz1+0.06);
  for(let i=0;i<3;i++){ const h=(FLOOR-0.05)*(3-i)/4; box(9.2,12.9,0,h,19.62,19.62+0.3*(i+1),stoneLight); }
}

/* ceiling (hidden together with the roof) */
{ const y0=FLOOR+mm(G.lv.ceil), y1=FLOOR+H, st=G.stair;
  const sx0=mm(st.x0), sx1=mm(st.x1), sz0=mm(st.z0), sz1=mm(st.z0+st.n*st.tread);
  for(const [x0,x1,z0,z1] of [[-0.22,13.42,-0.22,sz0],[-0.22,sx0,sz0,16.22],[sx1,13.42,sz0,16.22],[sx0,sx1,sz1,16.22],[-0.22,4.72,16.22,19.62],[13.42,15.52,6.78,11.62]])
    box(x0,x1,y0,y1,z0,z1,plaster,roofGroup,true);
}

/* roof */
{ const roofM=M(0x5A4842,.6,{side:THREE.DoubleSide,metalness:.1}), pos=[];
  for(const poly of G.roof){ const v=poly.map(([x,z,h])=>[mm(x),FLOOR+mm(h)+0.02,mm(z)]);
    for(let i=1;i<v.length-1;i++) pos.push(...v[0],...v[i],...v[i+1]); }
  const rg=new THREE.BufferGeometry(); rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); rg.computeVertexNormals();
  const roof=new THREE.Mesh(rg,roofM); roof.castShadow=true; roof.receiveShadow=true; roofGroup.add(roof);
  const fas=M(0x3A3D43,.6), eaveY=FLOOR+mm(G.eave), R=G.roof;
  const seg=(x0,z0,x1,z1)=>box(Math.min(x0,x1)-0.02,Math.max(x0,x1)+0.02,eaveY-0.18,eaveY+0.02,Math.min(z0,z1)-0.02,Math.max(z0,z1)+0.02,fas,roofGroup);
  seg(mm(R[0][0][0]),mm(R[0][0][1]),mm(R[0][3][0]),mm(R[0][3][1]));
  seg(mm(R[2][0][0]),mm(R[2][0][1]),mm(R[2][1][0]),mm(R[2][1][1]));
  seg(mm(R[3][0][0]),mm(R[3][0][1]),mm(R[3][1][0]),mm(R[3][1][1]));
  seg(mm(R[1][0][0]),mm(R[1][0][1]),mm(R[1][0][0]),mm(R[4][0][1]));
  seg(mm(R[1][1][0]),mm(R[5][0][1]),mm(R[1][1][0]),mm(R[1][1][1]));
  seg(mm(R[4][0][0]),mm(R[4][0][1]),mm(R[4][1][0]),mm(R[4][1][1]));
  seg(mm(R[5][0][0]),mm(R[5][0][1]),mm(R[5][1][0]),mm(R[5][1][1]));
  seg(mm(R[6][0][0]),mm(R[6][0][1]),mm(R[6][1][0]),mm(R[6][1][1]));
  box(5.3,6.0,FLOOR+4.8,FLOOR+7.3,13.6,14.3,brick,roofGroup);
  box(5.22,6.08,FLOOR+7.3,FLOOR+7.38,13.52,14.38,fas,roofGroup);
}

/* furniture */
scene.updateMatrixWorld(true);
const n0=house.children.length;
FURNITURE(house);
scene.updateMatrixWorld(true);
const bb=new THREE.Box3();
for(let i=n0;i<house.children.length;i++){
  const o=house.children[i]; bb.setFromObject(o);
  if(bb.max.y>FLOOR+0.35 && (bb.max.x-bb.min.x)<5 && (bb.max.z-bb.min.z)<5) addObst(bb.min.x,bb.max.x,bb.min.z,bb.max.z);
}

/* site */
buildSite();
{ const S=G.site, [px0,px1,pz0,pz1]=S.plot.map(mm), c=S.car;
  addObst(px0-0.3,px0+0.3,pz0,pz1); addObst(px0,px1,pz0-0.12,pz0+0.12); addObst(px1-0.12,px1+0.12,pz0,pz1); addObst(px0,px1,pz1-0.12,pz1+0.12);
  addObst(mm(c.x-c.len/2),mm(c.x+c.len/2),mm(c.z-c.w/2),mm(c.z+c.w/2));
  for(const [x,z] of S.trees) addObst(mm(x)-0.25,mm(x)+0.25,mm(z)-0.25,mm(z)+0.25);
  for(const [x,z,s] of [[24,0,1.3],[25,18,1.2],[-28,6,1.1],[-30,24,1.2],[8,34,1.1],[2,-10,1.2]]){
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,2.2*s,10),M(0x6B4E35,1)); tr.position.set(x,1.1*s,z); tr.castShadow=true; scene.add(tr);
    const cr=new THREE.Mesh(new THREE.SphereGeometry(1.6*s,18,14),M(0x5C8A4A,1)); cr.position.set(x,2.9*s,z); cr.castShadow=true; scene.add(cr); }
}

/* ---------- walking ---------- */
function floorAt(x,z){
  if(inHouse(x,z)) return FLOOR;
  if(x>4.72&&x<13.42&&z>16.22&&z<19.62) return FLOOR-0.05;
  if(x>-1.5&&x<-0.22&&z>7.6&&z<11.0) return FLOOR-0.02;
  for(let i=0;i<3;i++){ const x1=-1.5-0.4*i, x0=x1-0.4, gr=0.35*(i+1); if(x>x0&&x<=x1&&z>7.6-gr&&z<11+gr) return (FLOOR-0.02)*(3-i)/4; }
  if(x>9.2&&x<12.9&&z>=19.62&&z<20.52){ const i=Math.floor((z-19.62)/0.3); return (FLOOR-0.05)*(3-i)/4; }
  return 0.035;
}
const R_=0.24;
const hit=(x,z)=>{ for(const o of OBST) if(x+R_>o.x0&&x-R_<o.x1&&z+R_>o.z0&&z-R_<o.z1) return true; return false; };
const SPOTS=[
  {n:'Двор',x:-6.2,z:9.3,yaw:-Math.PI/2},{n:'Холл',x:1.2,z:9.3,yaw:-Math.PI/2},
  {n:'Зал',x:1.2,z:6.2,yaw:-0.70},{n:'Кухня',x:3.4,z:12.4,yaw:Math.PI-0.45},
  {n:'Спальня',x:12.4,z:6.3,yaw:0.75},{n:'Коридор',x:7.3,z:10.6,yaw:Math.PI},
  {n:'Терраса',x:7.6,z:16.9,yaw:Math.PI-0.6}];
const walk={on:false,x:0,z:0,y:2,yaw:0,pitch:-0.05,keys:{},jx:0,jy:0};
function goSpot(s){ walk.x=s.x; walk.z=s.z; walk.yaw=s.yaw; walk.pitch=-0.05; walk.y=floorAt(s.x,s.z)+1.6; }

/* ---------- UI ---------- */
const bOrbit=document.getElementById('bOrbit'), bWalk=document.getElementById('bWalk'), bRoof=document.getElementById('bRoof');
const joy=document.getElementById('joy'), knob=document.getElementById('knob'), spots=document.getElementById('spots'), hint=document.getElementById('hint');
const orbitHint='Крутите модель пальцем или мышью, приближайте щипком или колёсиком.';
const walkHint=matchMedia('(pointer: coarse)').matches?'Левый круг — идти. Проведите пальцем по экрану — осмотреться.':'W A S D или стрелки — идти, Shift — быстрее. Тяните мышью — осмотреться.';
for(const s of SPOTS){ const b=document.createElement('button'); b.textContent=s.n; b.onclick=()=>goSpot(s); spots.appendChild(b); }
let saved=null;
function setMode(w){
  walk.on=w; bWalk.setAttribute('aria-pressed',String(w)); bOrbit.setAttribute('aria-pressed',String(!w));
  controls.enabled=!w; joy.hidden=!w; spots.hidden=!w; hint.textContent=w?walkHint:orbitHint;
  if(w){ saved={p:camera.position.clone(),t:controls.target.clone()}; camera.fov=68; goSpot(SPOTS[0]); }
  else { camera.fov=45; if(saved){camera.position.copy(saved.p);controls.target.copy(saved.t);} camera.rotation.order='XYZ'; controls.update(); }
  camera.updateProjectionMatrix();
}
bOrbit.onclick=()=>setMode(false); bWalk.onclick=()=>setMode(true);
bRoof.onclick=()=>{ const on=bRoof.getAttribute('aria-pressed')!=='true'; bRoof.setAttribute('aria-pressed',String(on)); roofGroup.visible=on; };

/* joystick */
let jid=null;
const jmove=e=>{ const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, rad=r.width/2-18;
  let dx=e.clientX-cx, dy=e.clientY-cy; const d=Math.hypot(dx,dy); if(d>rad){dx*=rad/d;dy*=rad/d;}
  knob.style.transform=`translate(${dx}px,${dy}px)`; walk.jx=dx/rad; walk.jy=dy/rad; };
joy.addEventListener('pointerdown',e=>{jid=e.pointerId; joy.setPointerCapture(jid); jmove(e); e.preventDefault();});
joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) jmove(e); });
const jend=e=>{ if(e.pointerId!==jid) return; jid=null; walk.jx=walk.jy=0; knob.style.transform=''; };
joy.addEventListener('pointerup',jend); joy.addEventListener('pointercancel',jend);
/* look drag */
const looks=new Map();
canvas.addEventListener('pointerdown',e=>{ if(!walk.on) return; looks.set(e.pointerId,{x:e.clientX,y:e.clientY}); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(!walk.on||!looks.has(e.pointerId)) return; const p=looks.get(e.pointerId);
  walk.yaw-=(e.clientX-p.x)*0.0045; walk.pitch=Math.max(-1.25,Math.min(1.25,walk.pitch-(e.clientY-p.y)*0.0045)); p.x=e.clientX; p.y=e.clientY; });
const lend=e=>looks.delete(e.pointerId);
canvas.addEventListener('pointerup',lend); canvas.addEventListener('pointercancel',lend);
addEventListener('keydown',e=>{ walk.keys[e.code]=true; });
addEventListener('keyup',e=>{ walk.keys[e.code]=false; });
addEventListener('blur',()=>{ walk.keys={}; });

function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
{ const d=camera.aspect<1?Math.min(95,52/Math.max(camera.aspect,0.45)*0.62):48; const v=new THREE.Vector3(-0.55,0.5,0.67).normalize().multiplyScalar(d); camera.position.copy(controls.target).add(v); controls.update(); }
setMode(false);
document.getElementById('loading').hidden=true;

let last=performance.now();
function loop(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(walk.on){
    const k=walk.keys;
    let f=-walk.jy+((k.KeyW||k.ArrowUp)?1:0)-((k.KeyS||k.ArrowDown)?1:0);
    let s=walk.jx+((k.KeyD)?1:0)-((k.KeyA)?1:0);
    if(k.ArrowLeft) walk.yaw+=1.8*dt; if(k.ArrowRight) walk.yaw-=1.8*dt;
    const mag=Math.hypot(f,s); if(mag>1){f/=mag;s/=mag;}
    const sp=(k.ShiftLeft||k.ShiftRight)?3.4:1.7;
    const fx=-Math.sin(walk.yaw), fz=-Math.cos(walk.yaw), rx=Math.cos(walk.yaw), rz=-Math.sin(walk.yaw);
    const mx=(fx*f+rx*s)*sp*dt, mz=(fz*f+rz*s)*sp*dt;
    if(!hit(walk.x+mx,walk.z)) walk.x+=mx;
    if(!hit(walk.x,walk.z+mz)) walk.z+=mz;
    const ty=floorAt(walk.x,walk.z)+1.6; walk.y+=(ty-walk.y)*Math.min(1,dt*9);
    camera.position.set(walk.x,walk.y,walk.z); camera.rotation.order='YXZ'; camera.rotation.set(walk.pitch,walk.yaw,0);
  } else controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
